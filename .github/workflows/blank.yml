
name: Mamlaka Android APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'MamlakatAlAthkiya.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project ZIP
        run: |
          mkdir -p extracted

          if [ ! -f "MamlakatAlAthkiya.zip" ]; then
            echo "Project ZIP not found!"
            exit 1
          fi

          unzip -q MamlakatAlAthkiya.zip -d extracted

          echo "Project extracted successfully"

      - name: Find Android Project
        run: |
          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found!"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Found project: $PROJECT_DIR"

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Locate APK
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "APK was not generated!"
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/MamlakatAlAthkiya.apk

          echo "APK generated successfully!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MamlakatAlAthkiya-APK
          path: release/MamlakatAlAthkiya.apk
          retention-days: 30
